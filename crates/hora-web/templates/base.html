<!doctype html>
<html lang="{{ lang.code() }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ self.t("site-name") }}{% endblock %}</title>
<script type="module" src="/hora.js"></script>
<style>
/* Each text colour passes WCAG AA (4.5:1) on --bg, --panel and --glow in its theme; --mark is only for focus and glyphs (3:1). */
:root {
  color-scheme: light dark;
  --bg: #f4f5fa; --panel: #fff; --fg: #1a1f3d; --muted: #545a78; --rule: #c9cde0;
  --link: #2c3c91; --graha: #9e1b32; --lagna: #5a2d9c; --mark: #b87a00; --glow: #f6d27a;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", "URW Palladio L", Georgia, serif;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #151935; --panel: #1d2246; --fg: #e8e9f4; --muted: #a9aed0; --rule: #3a4170;
    --link: #a9b6ff; --graha: #ff8c99; --lagna: #cfa8ff; --mark: #f0b43c; --glow: #433410; }
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); margin: 0 auto; max-width: 46rem; padding: 0 1rem;
  font: 1.0625rem/1.6 var(--serif); font-variant-numeric: lining-nums; overflow-wrap: break-word; }
body:has(.results) { max-width: 78rem; }
a { color: var(--link); text-underline-offset: 0.2em; text-decoration-thickness: 1px; }
a:hover { text-decoration-thickness: 2px; }
:focus-visible { outline: 3px solid var(--mark); outline-offset: 2px; border-radius: 2px; }
h1, h2, h3 { font-weight: 500; line-height: 1.15; letter-spacing: -0.01em; text-wrap: balance; }
h1 { font-size: clamp(2.2rem, 6vw, 3.4rem); margin: 1.5rem 0 0.5rem; }
h2 { font-size: 1.5rem; margin: 2.5rem 0 0.75rem; }
h2 a, h1 a { color: inherit; text-decoration-color: var(--rule); }
p, li { text-wrap: pretty; }

/* The header holds the site's name and two quiet links. */
header { display: flex; align-items: baseline; gap: 1.5rem; padding: 1.25rem 0; border-bottom: 1px solid var(--rule); }
header a { text-decoration: none; color: var(--muted); }
header a:first-child { margin-right: auto; color: var(--fg); font-size: 1.35rem; font-style: italic; }
header a:hover { color: var(--link); }
footer { display: flex; flex-wrap: wrap; gap: 0.5rem 1.5rem; margin-top: 4rem; padding: 1.5rem 0; border-top: 1px solid var(--rule); font-size: 0.875rem; color: var(--muted); }

/* The form: one column of fields, method settings folded until wanted. */
form { display: grid; gap: 0.25rem; }
form p { margin: 0 0 0.6rem; }
label, summary { display: block; font-size: 0.9rem; color: var(--muted); margin-bottom: 0.2rem; }
input, select, button { font: inherit; color: inherit; }
input:not([type=hidden]), select { width: 100%; padding: 0.45rem 0.6rem; background: var(--panel);
  border: 1px solid var(--rule); border-radius: 6px; }
input:hover, select:hover { border-color: var(--muted); }
input:user-invalid, [aria-invalid=true] { border-color: var(--graha); box-shadow: inset 3px 0 0 var(--graha); }
.error { display: block; font-weight: normal; font-size: 0.9rem; color: var(--graha); margin-top: 0.2rem; }
details { border-block: 1px solid var(--rule); padding: 0.6rem 0; margin: 0.4rem 0 0.8rem; }
summary { cursor: pointer; color: var(--fg); margin: 0; list-style: none; }
summary::before { content: "+"; display: inline-block; width: 1.2em; color: var(--mark); transition: rotate 0.2s; }
details[open] summary::before { rotate: 45deg; }
details[open] summary { margin-bottom: 0.8rem; }
button { cursor: pointer; border: 1px solid var(--rule); border-radius: 999px; padding: 0.3rem 0.9rem; background: var(--panel); }
button:hover { border-color: var(--link); color: var(--link); }
form > p:last-child button { width: 100%; padding: 0.7rem; border-radius: 6px; border: 0; background: var(--link); color: var(--bg); font-size: 1.1rem; }
form > p:last-child button:hover { background: var(--fg); color: var(--bg); }
fieldset { border: 1px solid var(--rule); border-radius: 6px; margin: 0 0 0.8rem; padding: 0.5rem 0.75rem; }
fieldset ul { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 0.4rem; }
fieldset button { text-align: left; }

/* With a chart cast, the form becomes a sticky column beside it. */
@media (min-width: 62rem) {
  main:has(.results) { display: grid; grid-template: auto auto 1fr / 20rem minmax(0, 1fr); column-gap: 4rem; align-items: start; }
  main:has(.results) > :not(.results) { grid-column: 1; }
  main:has(.results) > form { position: sticky; top: 1rem; }
  .results { grid-column: 2; grid-row: 1 / span 3; }
  .results > h2:first-child { margin-top: 1.5rem; }
}

/* The chakra and its table light each other up: hover or focus a graha in one and it shows in both. */
figure { margin: 1rem 0 1.5rem; }
.chakra { display: block; width: 100%; max-width: 34rem; font-size: 15px; text-anchor: middle; font-family: var(--serif); }
.chakra path { fill: var(--panel); stroke: var(--link); stroke-width: 1.5; stroke-linejoin: round; }
.chakra text { cursor: default; paint-order: stroke; stroke: var(--glow); stroke-width: calc(var(--lit, 0) * 7px); stroke-linejoin: round; }
.chakra .graha { fill: var(--graha); }
.chakra .lagna { fill: var(--lagna); font-weight: bold; }
.chakra .mark { fill: var(--muted); font-size: 10px; }
figcaption { font-size: 0.9rem; color: var(--muted); max-width: 34rem; }
tr[data-body] { background: color-mix(in srgb, var(--glow) calc(var(--lit, 0) * 100%), transparent); }
/* hora.js marks main busy while a cast is fetched; the delay keeps a quick one from flickering. */
main[aria-busy=true] .results { opacity: 0.55; transition: opacity 0.2s 0.15s; }
@media (prefers-reduced-motion: no-preference) { tr[data-body], .chakra text { transition: background-color 0.15s, stroke-width 0.15s; } }

/* A wide table scrolls in its wrapper instead of widening the page on a phone. */
.scroll { overflow-x: auto; }
table { border-collapse: collapse; font-variant-numeric: tabular-nums lining-nums; font-size: 0.95rem; }
th, td { text-align: left; padding: 0.4rem 1.25rem 0.4rem 0; border-bottom: 1px solid var(--rule); white-space: nowrap; }
thead th { font-weight: normal; color: var(--muted); font-size: 0.875rem; border-bottom-color: var(--fg); }
tbody th { font-weight: 600; }
td a, th a { color: inherit; text-decoration-color: var(--rule); }
td a:hover, th a:hover { color: var(--link); }

/* The learning path: an ordered list drawn as a line of numbered stops. */
ol:has(> li > a[href*="/kb/"]) { list-style: none; padding: 0; counter-reset: stop; }
ol:has(> li > a[href*="/kb/"]) > li { counter-increment: stop; position: relative; padding: 0 0 1.1rem 3rem; color: var(--muted); font-size: 0.9rem; }
ol:has(> li > a[href*="/kb/"]) > li::before { content: counter(stop); position: absolute; left: 0; top: 0; width: 2rem; height: 2rem;
  display: grid; place-items: center; border: 1.5px solid var(--link); border-radius: 50%; background: var(--bg); color: var(--link); font-size: 0.9rem; z-index: 1; }
ol:has(> li > a[href*="/kb/"]) > li:not(:last-child)::after { content: ""; position: absolute; left: calc(1rem - 0.75px); top: 2rem; bottom: 0; border-left: 1.5px solid var(--rule); }
ol:has(> li > a[href*="/kb/"]) > li > a { display: block; font-size: 1.15rem; line-height: 2rem; text-decoration: none; }
ol:has(> li > a[href*="/kb/"]) > li > a:hover { text-decoration: underline; }
ol:has(> li > a[href*="/kb/"]) > li:has(a:hover, a:focus-visible)::before { background: var(--link); color: var(--bg); }

/* Knowledge base prose keeps a book's measure. */
main > :is(p, ul, ol, blockquote, h2, h3) { max-width: 38rem; }
main:has(.results) > p { max-width: none; }

@media print {
  header, footer, form, main > h1 + p { display: none; }
  body, :root { background: #fff; color: #000; max-width: none; }
  main:has(.results) { display: block; }
  a { color: inherit; text-decoration: none; }
  section, figure { break-inside: avoid; }
}
</style>
</head>
<body>
<header>
<a href="/{{ lang.code() }}/">{{ self.t("site-name") }}</a>
<a href="/{{ lang.code() }}/kb/">{{ self.t("kb") }}</a>
<a href="{{ switch_href }}" hreflang="{{ lang.other().code() }}" lang="{{ lang.other().code() }}">{{ self.t("other-language") }}</a>
</header>
<main>
{% block main %}{% endblock %}
</main>
<footer>
<a href="{{ self.repository() }}">{{ self.t("source-code") }}</a>
<a href="/{{ lang.code() }}/privacy">{{ self.t("privacy") }}</a>
</footer>
</body>
</html>
