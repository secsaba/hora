name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # shortcut: Ubuntu, not Debian; switch to a Debian container if a distro-specific failure appears
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      - run: nix develop -c cargo fmt --check
      - run: nix develop -c cargo test --locked
      - run: nix develop -c cargo clippy --all-targets -- -D warnings
      - run: nix develop -c cargo deny check
