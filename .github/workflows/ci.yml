name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name != 'schedule'
    # shortcut: Ubuntu, not Debian; switch to a Debian container if a distro-specific failure appears
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # shortcut: no Nix store or cargo cache, every run rebuilds; add one when CI time hurts
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      # rustc's tidy limit; tests/ is exempt, since golden.rs pins every printed value.
      - name: no source file over 3,000 lines
        run: |
          long=$(find crates/*/src -name '*.rs' -exec awk 'END { if (NR > 3000) print FILENAME ": " NR " lines" }' {} \;)
          if [ -n "$long" ]; then echo "$long"; exit 1; fi
      - run: nix develop -c cargo fmt --check
      - run: nix develop -c cargo test --locked
      # The deploy image is a release build, and its optimiser has miscompiled code that debug passed.
      - run: nix develop -c cargo test --locked --release
      - run: nix develop -c cargo clippy --all-targets -- -D warnings
      - run: nix develop -c cargo deny check licenses bans sources

  # Separate job: a newly published advisory must not turn unrelated changes red.
  advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      - run: nix develop -c cargo deny check advisories
